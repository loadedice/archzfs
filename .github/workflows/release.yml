on:
  workflow_dispatch:
    inputs:
      kernel_version:
        required: false
    types: [arch-kernel-update]

  push:
    branches: [master]
    paths:
      - '**.sh'
      - '.github/workflows/**'
      - '!.github/workflows/watcher.yml'
      - 'build-container/**'
      - 'packages/**'
  schedule:
    - cron: "4 2 * * *"

name: Release
run-name: ${{ inputs.kernel_version || 'Manual/Cron' }} release

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_NAME: experimental
  TEMP_RELEASE_NAME: _experimental
  FAILOVER_RELEASE_NAME: failover

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: Release

    steps:

      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder container
        uses: docker/build-push-action@v6
        with:
          context: ./build-container
          tags: archzfs-builder
          load: true
          build-args: |
            MIRROR_URL=${{ vars.MIRROR_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Pacman packages
        uses: actions/cache@v4
        with:
          path: .pacman-cache
          key: pacman-pkg
          restore-keys: |
            pacman-pkg
          
      - name: Run builder container
        env:
          GPG_KEY_DATA: "${{ secrets.GPG_KEY_DATA }}"
          GPG_KEY_ID: "${{ vars.GPG_KEY_ID }}"
        run: |
          docker run \
            -e GPG_KEY_DATA \
            -e GPG_KEY_ID \
            -e FAILOVER_RELEASE_NAME \
            --privileged \
            --rm \
            -v "$(pwd):/src" \
            -v "$(pwd)/.pacman-cache:/var/cache/pacman/pkg"
            archzfs-builder

      - name: Delete possible leftover temporary release
        env:
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh release delete --yes "${{ env.TEMP_RELEASE_NAME }}" || true

      - name: Publish mainline to a temporary release
        uses: ncipollo/release-action@v1.20.0
        with:
          name: ${{ env.TEMP_RELEASE_NAME }}
          tag: ${{ env.TEMP_RELEASE_NAME }}
          commit: ${{ github.sha }}
          artifacts: ./repo/*
          artifactErrorsFailBuild: true
          bodyFile: ci/releases/body-${{ env.RELEASE_NAME }}.md

      - name: Delete the existing mainline release
        env:
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh release delete --yes "${{ env.RELEASE_NAME }}" || true

      - name: Rename the temporary release to mainline
        env:
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh release edit --latest --tag "${{ env.RELEASE_NAME }}" --title "${{ env.RELEASE_NAME }}" "${{ env.TEMP_RELEASE_NAME}}"

      - name: Delete the temporary Git tag
        env:
          GH_REPO: "${{ github.repository }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${{ env.TEMP_RELEASE_NAME }}"

      - name: Tag the mainline release
        uses: rickstaa/action-create-tag@v1.7.2
        with:
          tag: ${{ env.RELEASE_NAME }}
          force_push_tag: true

      - name: Release failover
        uses: ncipollo/release-action@v1.20.0
        with:
          name: ${{ env.FAILOVER_RELEASE_NAME }}
          tag: ${{ env.FAILOVER_RELEASE_NAME }}
          commit: ${{ github.sha }}
          artifacts: ./repo/*
          allowUpdates: true
          artifactErrorsFailBuild: true
          omitBody: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          prerelease: true

      - name: Tag the failover release
        uses: rickstaa/action-create-tag@v1.7.2
        with:
          tag: ${{ env.FAILOVER_RELEASE_NAME }}
          force_push_tag: true
