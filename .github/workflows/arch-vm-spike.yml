name: Arch VM runtime spike

on:
  push:
    branches: [spike/arch-vm-runtime-tests]
    paths:
      - '.github/workflows/arch-vm-spike.yml'
      - 'ci/runtime/**'
  workflow_dispatch:
    inputs:
      scope:
        description: full suite, newly unresolved failures, or untested LTS tail
        type: choice
        default: full
        options: [full, focus, tail]
      shard:
        description: all, or an upstream test-group fraction such as 1/4
        type: string
        default: all
      diagnose:
        description: Diagnose the nine unexpected failures with controlled reruns
        type: boolean
        default: false
      candidate_run:
        description: Existing candidate run ID, or fresh to rebuild packages
        type: string
        default: '39414535555'
      zts:
        description: Run the packaged upstream ZFS Test Suite after smoke tests
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.diagnose && 'arch-vm-diagnose' || 'arch-vm-spike' }}-${{ github.ref }}-${{ inputs.scope || 'full' }}-${{ inputs.shard || 'all' }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime / ${{ matrix.kernel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        kernel: [linux, linux-lts]
    env:
      KERNEL_PACKAGE: ${{ matrix.kernel }}
      MIRROR_URL: ${{ vars.MIRROR_URL }}
      RUN_ZTS: ${{ inputs.zts && 'true' || 'false' }}
      ZTS_DIAGNOSE: ${{ inputs.diagnose && 'true' || 'false' }}
      ZTS_SCOPE: ${{ inputs.scope || 'full' }}
      ZTS_SHARD: ${{ inputs.shard || 'all' }}
      # Reuse the completed builds while iterating on VM setup. Set to fresh
      # when packaging inputs change; the reuse script checks that boundary.
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run || '39414535555' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate harness shell syntax
        run: |
          for script in ci/runtime/*.sh; do
            bash -n "$script"
          done
          git diff --check HEAD^ HEAD -- ci/runtime .github/workflows/arch-vm-spike.yml

      - name: Check runner and required mirror
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          test -n "$MIRROR_URL"
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils acl gnupg
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm

      - name: Build the existing ArchZFS builder
        if: env.CANDIDATE_RUN_ID == 'fresh'
        run: docker build --build-arg "MIRROR_URL=$MIRROR_URL" -t archzfs-runtime-builder build-container

      - name: Build fresh candidate packages without failover
        if: env.CANDIDATE_RUN_ID == 'fresh'
        timeout-minutes: 75
        run: |
          mkdir -p runtime-results
          set -o pipefail
          docker run --rm --privileged \
            -e CI -e GITHUB_ACTIONS -e RUNNER_ENVIRONMENT -e GITHUB_SHA \
            -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e KERNEL_PACKAGE -e MIRROR_URL \
            -v "$PWD:/src" --entrypoint /bin/bash archzfs-runtime-builder \
            /src/ci/runtime/build-candidate.sh 2>&1 | tee runtime-results/build.log

      - name: Restore runner ownership after the build container
        if: always()
        run: |
          # The builder recursively assigns the mounted checkout to buildbot.
          # Return it to the host runner before VM setup and artifact upload,
          # including when the container exits with a build failure.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Reuse recorded candidate packages
        if: env.CANDIDATE_RUN_ID != 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/runtime/reuse-candidate.sh

      - name: Boot Arch and test installed candidate packages
        timeout-minutes: 300
        run: bash ci/runtime/run-vm.sh

      - name: Retain candidate packages and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-runtime-${{ matrix.kernel }}-${{ github.run_attempt }}
          path: |
            runtime-results/
            ${{ env.CANDIDATE_RUN_ID == 'fresh' && 'runtime-candidate/' || '' }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
